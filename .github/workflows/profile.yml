name: Build profile SVGs

on:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main, redesign]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-output
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch previous output for cache
        run: |
          if git ls-remote --exit-code --heads origin output >/dev/null; then
            git fetch --depth=1 origin output
            git worktree add prev FETCH_HEAD
          else
            echo "No output branch yet; building without cache"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Build SVGs
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build profile SVGs ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
