<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" role="img" aria-label="endlessYoung">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#E23CA9"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#E23CA9"/>
    </linearGradient>
    <radialGradient id="orbL" cx="18%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#7C5CFC" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C5CFC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbR" cx="82%" cy="70%" r="38%">
      <stop offset="0%" stop-color="#E23CA9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E23CA9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1C2436" stroke-width="0.7"/>
    </pattern>
    <style>
      .dash { stroke-dasharray: 5 9; animation: flow 1.8s linear infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .pulse2 { animation: pulse 2.2s ease-in-out infinite 0.6s; }
      .led { animation: led 1.4s ease-in-out infinite; }
      .scan { animation: scan 5.5s ease-in-out infinite; }
      .flicker { animation: flicker 4s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -56; } }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes led { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes scan { 0% { transform: translateY(-30px); opacity: 0; } 12% { opacity: .25; } 100% { transform: translateY(300px); opacity: 0; } }
      @keyframes flicker { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .dash,.pulse,.pulse2,.led,.scan,.flicker { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#07090F"/>
  <rect width="1200" height="320" fill="url(#orbL)"/>
  <rect width="1200" height="320" fill="url(#orbR)"/>
  <rect x="16" y="16" width="1168" height="288" fill="url(#grid)" stroke="#2A3348" stroke-width="1.2"/>

  <g fill="none" stroke="url(#beam)" stroke-width="2">
    <path d="M16 48V16H48"/>
    <path d="M1184 48V16H1152"/>
    <path d="M16 272V304H48"/>
    <path d="M1184 272V304H1152"/>
  </g>
  <rect x="16" y="16" width="1168" height="288" fill="none" stroke="#C084FC" stroke-opacity="0.12"/>
  <rect class="scan" x="16" y="16" width="1168" height="18" fill="url(#beam)" opacity="0.18"/>

  <g fill="none" stroke="url(#wire)" stroke-width="1.6" opacity="0.95">
    <path id="w1" class="dash" d="M188 86 L118 150"/>
    <path id="w2" class="dash" d="M188 86 L262 150"/>
    <path id="w3" class="dash" d="M118 170 L188 226"/>
    <path id="w4" class="dash" d="M262 170 L188 226"/>
    <path id="w5" class="dash" d="M188 86 L188 226"/>
  </g>
  <g filter="url(#glow)">
    <circle r="3.6" fill="#F5F3FF">
      <animateMotion dur="2.1s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#w1"/></animateMotion>
    </circle>
    <circle r="3.6" fill="#F5F3FF">
      <animateMotion dur="2.4s" repeatCount="indefinite" rotate="auto" begin="0.4s"><mpath xlink:href="#w2"/></animateMotion>
    </circle>
    <circle r="3.2" fill="#E23CA9">
      <animateMotion dur="2.6s" repeatCount="indefinite" rotate="auto" begin="0.8s"><mpath xlink:href="#w5"/></animateMotion>
    </circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
    <g class="pulse">
      <rect x="146" y="58" width="84" height="36" rx="4" fill="#101522" stroke="#7C5CFC" stroke-width="1.4"/>
      <rect x="146" y="58" width="5" height="36" rx="2" fill="#7C5CFC"/>
      <text x="188" y="80" fill="#F3EEFF">Agent</text>
    </g>
    <g>
      <rect x="66" y="142" width="104" height="36" rx="4" fill="#101522" stroke="#8B7CFF" stroke-width="1.4"/>
      <rect x="66" y="142" width="5" height="36" rx="2" fill="#8B7CFF"/>
      <text x="118" y="164" fill="#F3EEFF">Framework</text>
    </g>
    <g class="pulse2">
      <rect x="210" y="142" width="104" height="36" rx="4" fill="#101522" stroke="#E23CA9" stroke-width="1.4"/>
      <rect x="210" y="142" width="5" height="36" rx="2" fill="#E23CA9"/>
      <text x="262" y="164" fill="#F3EEFF">Compose</text>
    </g>
    <g>
      <rect x="136" y="226" width="104" height="36" rx="4" fill="#101522" stroke="#6E7B94" stroke-width="1.4"/>
      <rect x="136" y="226" width="5" height="36" rx="2" fill="#6E7B94"/>
      <text x="188" y="248" fill="#D5DCEC">Runtime</text>
    </g>
  </g>
  <circle class="led" cx="188" cy="58" r="3.4" fill="#C084FC" filter="url(#glow)"/>

  <line x1="372" y1="40" x2="372" y2="280" stroke="#2A3348" stroke-width="1"/>
  <line x1="372" y1="40" x2="372" y2="280" stroke="url(#beam)" stroke-width="1" stroke-dasharray="2 10" opacity="0.7" class="dash"/>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3.5">
      <circle class="led" cx="408" cy="62" r="4" fill="#34D399" filter="url(#glow)"/>
      <text x="422" y="66" fill="#8B93A7">SYSTEM ONLINE</text>
    </g>
    <text x="400" y="128" font-size="58" font-weight="700" fill="#C084FC" opacity="0.28" filter="url(#soft)">endlessYoung</text>
    <text x="398" y="126" font-size="58" font-weight="700" fill="url(#title)">endlessYoung</text>
    <text class="flicker" x="402" y="168" font-size="20" fill="#C084FC">&#x52A0;&#x6CB9;&#x6BCF;&#x4E00;&#x5929;</text>
    <text x="402" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#9AA3B8">Android Framework  &#x00B7;  Compose  &#x00B7;  Agents</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9AA3B8">
    <rect x="968" y="48" width="188" height="92" rx="2" fill="#0C111C" stroke="url(#beam)" stroke-width="1"/>
    <text x="984" y="74" fill="#6E7B94">OWNER</text>
    <text x="1048" y="74" fill="#EDE9FE">foreverYoung</text>
    <text x="984" y="96" fill="#6E7B94">ORG</text>
    <text x="1048" y="96" fill="#EDE9FE">Microsoft</text>
    <text x="984" y="118" fill="#6E7B94">SHEET</text>
    <text x="1048" y="118" fill="#C084FC">01 / PROFILE</text>
  </g>

  <g stroke="url(#beam)" stroke-width="1.4">
    <line x1="398" y1="268" x2="470" y2="268"/>
    <line x1="1040" y1="268" x2="1156" y2="268"/>
  </g>
</svg>
