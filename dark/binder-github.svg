<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 120" width="380" height="120" role="img" aria-label="Open github">
<defs>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7C5CFC"/><stop offset="50%" stop-color="#C084FC"/><stop offset="100%" stop-color="#E23CA9"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1C2436" stroke-width="0.7" />
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  
</defs>
<style>
  .in { animation: in .45s ease-out both; }
  .rise { animation: rise .5s ease-out both; }
  .grow { animation: grow .6s ease-out both; transform-box: fill-box; transform-origin: left center; }
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  .blink { animation: blink 1s steps(1) infinite; }
  .dash { stroke-dasharray: 5 9; animation: flow 1.8s linear infinite; }
  .scan { animation: scan 6s ease-in-out infinite; }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes flow { to { stroke-dashoffset: -56; } }
  @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .2; } 100% { transform: translateY(var(--scan-h, 260px)); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .hide-reduced { display: none; }
  }
</style>
<rect width="380" height="120" fill="#07090F"/>
<rect x="12" y="12" width="356" height="96" fill="url(#grid)" stroke="#2A3348" stroke-width="1"/>
<g fill="none" stroke="url(#beam)" stroke-width="2"><path d="M12 32V12H32"/><path d="M368 32V12H348"/><path d="M12 88V108H32"/><path d="M368 88V108H348"/></g>


<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <path id="tx" d="M122 43 H258" fill="none" stroke="url(#beam)" stroke-width="1.4" class="dash"/>
  <rect x="26" y="26" width="96" height="34" rx="3" fill="#0C111C" stroke="#8B93A7" stroke-width="1.2"/>
<text x="74" y="47" text-anchor="middle" fill="#F3EEFF" font-size="10.5">Client.Proxy</text><rect x="146" y="26" width="88" height="34" rx="3" fill="#0C111C" stroke="#C084FC" stroke-width="1.2"/>
<text x="190" y="47" text-anchor="middle" fill="#F3EEFF" font-size="10.5">/dev/binder</text><rect x="258" y="26" width="96" height="34" rx="3" fill="#0C111C" stroke="#E23CA9" stroke-width="1.2"/>
<text x="306" y="47" text-anchor="middle" fill="#F3EEFF" font-size="9.5">GitHubService</text>
  <g class="hide-reduced" filter="url(#glow)">
    <circle r="3.2" fill="#F3EEFF"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath xlink:href="#tx"/></animateMotion></circle>
  </g>
  <text x="26" y="88" fill="#34D399" font-size="13">transact(GITHUB)</text>
  <text x="354" y="88" text-anchor="end" fill="#8B93A7" font-size="10" letter-spacing="1.5">TAP TO OPEN ↗</text>
  <line x1="26" y1="98" x2="354" y2="98" stroke="#2A3348"/>
</g>

</svg>