<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Latest blog posts as logcat output">
<defs>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7C5CFC"/><stop offset="50%" stop-color="#C084FC"/><stop offset="100%" stop-color="#E23CA9"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1C2436" stroke-width="0.7" />
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  
</defs>
<style>
  .in { animation: in .45s ease-out both; }
  .rise { animation: rise .5s ease-out both; }
  .grow { animation: grow .6s ease-out both; transform-box: fill-box; transform-origin: left center; }
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  .blink { animation: blink 1s steps(1) infinite; }
  .dash { stroke-dasharray: 5 9; animation: flow 1.8s linear infinite; }
  .scan { animation: scan 6s ease-in-out infinite; }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes flow { to { stroke-dashoffset: -56; } }
  @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .2; } 100% { transform: translateY(var(--scan-h, 260px)); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .hide-reduced { display: none; }
  }
</style>
<rect width="1200" height="280" fill="#07090F"/>
<rect x="12" y="12" width="1176" height="256" fill="url(#grid)" stroke="#2A3348" stroke-width="1"/>
<g fill="none" stroke="url(#beam)" stroke-width="2"><path d="M12 44V12H44"/><path d="M1188 44V12H1156"/><path d="M12 236V268H44"/><path d="M1188 236V268H1156"/></g>


