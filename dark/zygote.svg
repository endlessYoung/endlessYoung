    <stop offset="0%" stop-color="#7C5CFC"/><stop offset="50%" stop-color="#C084FC"/><stop offset="100%" stop-color="#E23CA9"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1C2436" stroke-width="0.7" />
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
