<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="endlessYoung — boot sequence">
<defs>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/><stop offset="50%" stop-color="#C9D8F5"/><stop offset="100%" stop-color="#FFD166"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#3D6FC4" stroke-width="0.5" stroke-opacity="0.6"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="0" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/><stop offset="65%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#FFD166"/>
  </linearGradient>
</defs>
<style>
  .in { animation: in .45s ease-out both; }
  .rise { animation: rise .5s ease-out both; }
  .grow { animation: grow .6s ease-out both; transform-box: fill-box; transform-origin: left center; }
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  .blink { animation: blink 1s steps(1) infinite; }
  .dash { stroke-dasharray: 5 9; animation: flow 1.8s linear infinite; }
  .scan { animation: scan 6s ease-in-out infinite; }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes flow { to { stroke-dashoffset: -56; } }
  @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .2; } 100% { transform: translateY(var(--scan-h, 260px)); opacity: 0; } }

  .logs { animation: recede .9s ease-in 4s forwards; }
  .ignite { animation: ignite 1.2s ease-out 4.1s both; transform-box: fill-box; transform-origin: center; }
  .tagline { animation: in .8s ease-out 4.8s both; }
  @keyframes recede { to { opacity: .16; transform: translateY(-12px); } }
  @keyframes ignite { from { opacity: 0; transform: scale(.94); } 60% { opacity: 1; } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .logs { opacity: .16; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .hide-reduced { display: none; }
  }
</style>
<rect width="1200" height="360" fill="#0B3D91"/>
<rect x="12" y="12" width="1176" height="336" fill="url(#grid)" stroke="#9DB8E8" stroke-width="1"/>
<g fill="none" stroke="url(#beam)" stroke-width="2"><path d="M12 44V12H44"/><path d="M1188 44V12H1156"/><path d="M12 316V348H44"/><path d="M1188 316V348H1156"/></g>
<rect class="scan hide-reduced" x="12" y="12" width="1176" height="14" fill="url(#beam)" opacity="0" style="--scan-h:322px"/>

