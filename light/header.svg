  <text x="600" y="193" text-anchor="middle" font-family="ui-sans-serif, system-ui, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="68" font-weight="700" fill="url(#title)">endlessYoung</text>
</g>
