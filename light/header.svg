  <text x="600" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FFD166"><tspan fill="#A7F3D0">$ </tspan>Afternoon — shipping features.<tspan class="blink" fill="#FFFFFF"> ▍</tspan></text>
