<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="加油每一天">
<defs>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/><stop offset="50%" stop-color="#C9D8F5"/><stop offset="100%" stop-color="#FFD166"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#3D6FC4" stroke-width="0.5" stroke-opacity="0.6"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="0" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  
</defs>
<style>
  .in { animation: in .45s ease-out both; }
  .rise { animation: rise .5s ease-out both; }
  .grow { animation: grow .6s ease-out both; transform-box: fill-box; transform-origin: left center; }
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  .blink { animation: blink 1s steps(1) infinite; }
  .dash { stroke-dasharray: 5 9; animation: flow 1.8s linear infinite; }
  .scan { animation: scan 6s ease-in-out infinite; }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes flow { to { stroke-dashoffset: -56; } }
  @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .2; } 100% { transform: translateY(var(--scan-h, 260px)); opacity: 0; } }

  .dim { animation: dim 3s ease-in .5s both; }
  .breathe { animation: breathe 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes dim { from { opacity: 0; } to { opacity: .82; } }
  @keyframes breathe { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.25); } }
  @media (prefers-reduced-motion: reduce) { .dim { opacity: .82; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .hide-reduced { display: none; }
  }
</style>
<rect width="1200" height="160" fill="#0B3D91"/>
<rect x="12" y="12" width="1176" height="136" fill="url(#grid)" stroke="#9DB8E8" stroke-width="1"/>
<g fill="none" stroke="url(#beam)" stroke-width="2"><path d="M12 38V12H38"/><path d="M1188 38V12H1162"/><path d="M12 122V148H38"/><path d="M1188 122V148H1162"/></g>


<rect class="dim" x="12" y="12" width="1176" height="136" fill="#0B3D91"/>
<g text-anchor="middle">
  <text x="600" y="78" font-family="ui-sans-serif, system-ui, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" letter-spacing="6" filter="url(#glow)">加油每一天</text>
  <circle class="breathe" cx="600" cy="106" r="4" fill="#FFD166" filter="url(#glow)"/>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#C9D8F5" letter-spacing="1.5">
  <text x="40" y="132">screen_off_timeout reached</text>
  <text class="in" style="animation-delay:3s" x="40" y="116" fill="#A7F3D0">● standby</text>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#C9D8F5" letter-spacing="1">
  <rect x="888" y="114" width="300" height="34" fill="#0B3D91" stroke="#9DB8E8" stroke-width="1"/>
  <line x1="888" y1="131" x2="1188" y2="131" stroke="#9DB8E8" stroke-width="0.6"/>
  <line x1="1058" y1="114" x2="1058" y2="148" stroke="#9DB8E8" stroke-width="0.6"/>
  <text x="896" y="126">DRAWN BY endlessYoung</text>
  <text x="1066" y="126">SHEET 10 / 10</text>
  <text x="896" y="143" fill="#FFFFFF">STANDBY</text>
  <text x="1066" y="143">SCALE 1:1</text>
</g>
</svg>