<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 580 200" width="580" height="200" role="img" aria-label="img2points — Turn a photo into deterministic pointillism and bead art, exported as SVG and PNG.">
<defs>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/><stop offset="50%" stop-color="#C9D8F5"/><stop offset="100%" stop-color="#FFD166"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#3D6FC4" stroke-width="0.5" stroke-opacity="0.6"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="0" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  
</defs>
<style>
  .in { animation: in .45s ease-out both; }
  .rise { animation: rise .5s ease-out both; }
  .grow { animation: grow .6s ease-out both; transform-box: fill-box; transform-origin: left center; }
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  .blink { animation: blink 1s steps(1) infinite; }
  .dash { stroke-dasharray: 5 9; animation: flow 1.8s linear infinite; }
  .scan { animation: scan 6s ease-in-out infinite; }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes flow { to { stroke-dashoffset: -56; } }
  @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .2; } 100% { transform: translateY(var(--scan-h, 260px)); opacity: 0; } }

  .edge { animation: edge 3.2s ease-in-out infinite; }
  @keyframes edge { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .hide-reduced { display: none; }
  }
</style>
<rect width="580" height="200" fill="#0B3D91"/>
<rect x="12" y="12" width="556" height="176" fill="url(#grid)" stroke="#9DB8E8" stroke-width="1"/>
<g fill="none" stroke="url(#beam)" stroke-width="2"><path d="M12 44V12H44"/><path d="M568 44V12H536"/><path d="M12 156V188H44"/><path d="M568 156V188H536"/></g>


<g class="rise" style="animation-delay:0.45s" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="56" y="20" width="468" height="138" rx="10" fill="#0E4AA8" stroke="#9DB8E8" opacity="0.25"/><rect x="48" y="27" width="484" height="138" rx="10" fill="#0E4AA8" stroke="#9DB8E8" opacity="0.5"/>
  <rect class="edge" x="40" y="34" width="500" height="138" rx="10" fill="#0E4AA8" stroke="url(#beam)" stroke-width="1.4"/>
  <line x1="40" y1="70" x2="540" y2="70" stroke="#9DB8E8"/>
  <circle cx="62" cy="52" r="10" fill="none" stroke="#FFFFFF"/>
  <text x="62" y="56" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">I</text>
  <text x="80" y="57" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="600">img2points</text>
  <text x="524" y="57" text-anchor="end" fill="#C9D8F5" font-size="10" letter-spacing="1.5">TASK #04  ⋮</text>
  <text x="58" y="96" fill="#C9D8F5" font-family="ui-sans-serif, system-ui, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13">Turn a photo into deterministic pointillism and bead art,</text><text x="58" y="115" fill="#C9D8F5" font-family="ui-sans-serif, system-ui, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13">exported as SVG and PNG.</text>
  <rect x="58" y="140" width="82" height="18" rx="9" fill="none" stroke="#9DB8E8"/><text x="99" y="153" text-anchor="middle" fill="#FFFFFF" font-size="10">TypeScript</text><rect x="146" y="140" width="35.8" height="18" rx="9" fill="none" stroke="#9DB8E8"/><text x="163.9" y="153" text-anchor="middle" fill="#FFFFFF" font-size="10">SVG</text><rect x="187.8" y="140" width="121.6" height="18" rx="9" fill="none" stroke="#9DB8E8"/><text x="248.60000000000002" y="153" text-anchor="middle" fill="#FFFFFF" font-size="10">Image Processing</text>
  <text x="524" y="153" text-anchor="end" fill="#FFD166" font-size="10" letter-spacing="1.5">OPEN ↗</text>
